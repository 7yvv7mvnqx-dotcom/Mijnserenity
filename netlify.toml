[build]
  command = "node scripts/fetch-victron-gui.mjs"
  publish = "."


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


# MijnSerenity 6.7.1 — waterwegrouter zonder Functions-map
[[redirects]]
  from = "/api/waterway-route"
  to = "https://brouter.grade.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/waterway-route-backup"
  to = "https://brouter.de/brouter"
  status = 200
  force = true


# MijnSerenity 6.7.2 — Overpass-proxy voor bruggen, sluizen en POI's
[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-backup"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true


# MijnSerenity 8.25.6 — EuRIS Notice to Skippers met locatieverrijking voor vaarwegberichten
[[redirects]]
  from = "/api/euris-nts"
  to = "/.netlify/functions/euris-nts"
  status = 200
  force = true

# MijnSerenity 7.14.7 — beveiligde VRM proxy voor RuuviTags
[[redirects]]
  from = "/api/vrm-ruuvi"
  to = "/.netlify/functions/vrm-ruuvi"
  status = 200
  force = true

# MijnSerenity 8.21.1 — VRM MQTT-config voor de echte ingebedde Cerbo GUI-v2
[[redirects]]
  from = "/api/victron-console-config"
  to = "/.netlify/functions/victron-console-config"
  status = 200
  force = true

# MijnSerenity 7.15.16 — RWS WaterWebservices via same-origin proxy
# Nodig voor iOS/Safari: directe cross-origin POST naar RWS gaf "Load failed".
[[redirects]]
  from = "/api/rws-water-catalogus"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/METADATASERVICES/OphalenCatalogus"
  status = 200
  force = true

[[redirects]]
  from = "/api/rws-water-latest"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# MijnSerenity — voorkom gemengde PWA-versies
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth-bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 8.21.1 — officiële Victron GUI-v2 wordt tijdens deploy als statische app opgebouwd.
[[headers]]
  for = "/victron-gui/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Referrer-Policy = "no-referrer"

# De release bevat een gzip-WASM. De build maakt hiervan een bytekopie op het
# normale .wasm-pad; deze header laat de browser hem correct decomprimeren.
[[headers]]
  for = "/victron-gui/venus-gui-v2.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=604800, immutable"

# 7.18.33 — alle root-JS/CSS komt eerst vers van Netlify; offline caching
# blijft via de service worker beschikbaar. Dit voorkomt een mix van oude
# 7.18.12/7.18.32 assets met de actuele build.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# MijnSerenity 7.18.30 — MultiPlus-II bediening altijd vers laden
[[headers]]
  for = "/multiplus-control-71830.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"


