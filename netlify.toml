[build]
  command = "node scripts/fetch-victron-gui.mjs && node scripts/optimize-production-shell.mjs && node tests/static-assets.test.mjs && node tests/release-8310.test.mjs && node tests/performance-start-8312.test.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Routering en databronnen.
[[redirects]]
  from = "/api/waterway-route"
  to = "https://brouter.grade.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/waterway-route-backup"
  to = "https://brouter.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-backup"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/euris-nts"
  to = "/.netlify/functions/euris-nts"
  status = 200
  force = true

[[redirects]]
  from = "/api/victron-console-config"
  to = "/.netlify/functions/victron-console-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/rws-water-catalogus"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/METADATASERVICES/OphalenCatalogus"
  status = 200
  force = true

[[redirects]]
  from = "/api/rws-water-latest"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# App-shell en code altijd vers; de service worker verzorgt gecontroleerde offline fallback.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Officiële Victron GUI-v2.
[[headers]]
  for = "/victron-gui/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/victron-gui/venus-gui-v2.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=604800, immutable"
