[build]
  command = "node scripts/fetch-victron-gui.mjs && node scripts/build-production-8311.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"

# Externe route-/POI-bronnen via same-origin proxy.
[[redirects]]
  from = "/api/waterway-route"
  to = "https://brouter.grade.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/waterway-route-backup"
  to = "https://brouter.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-backup"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true

# Lokale serverless functies.
[[redirects]]
  from = "/api/euris-nts"
  to = "/.netlify/functions/euris-nts"
  status = 200
  force = true

[[redirects]]
  from = "/api/victron-console-config"
  to = "/.netlify/functions/victron-console-config"
  status = 200
  force = true

# RWS WaterWebservices same-origin voor iOS/Safari.
[[redirects]]
  from = "/api/rws-water-catalogus"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/METADATASERVICES/OphalenCatalogus"
  status = 200
  force = true

[[redirects]]
  from = "/api/rws-water-latest"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen"
  status = 200
  force = true

# App-shell en service worker worden nooit door de CDN-cache vastgezet.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth-bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Root-JS/CSS mag worden hergevalideerd; de ?v=831100 URL voorkomt versie-mix.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Officiële Victron GUI-v2.
[[headers]]
  for = "/victron-gui/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/victron-gui/venus-gui-v2.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=604800, immutable"

# SPA fallback altijd als laatste redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
