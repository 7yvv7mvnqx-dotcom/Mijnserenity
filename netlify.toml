[build]
  publish = "."


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


# MijnSerenity 6.7.1 — waterwegrouter zonder Functions-map
[[redirects]]
  from = "/api/waterway-route"
  to = "https://brouter.grade.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/waterway-route-backup"
  to = "https://brouter.de/brouter"
  status = 200
  force = true


# MijnSerenity 6.7.2 — Overpass-proxy voor bruggen, sluizen en POI's
[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-backup"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true




[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# MijnSerenity 7.3.2 — voorkom gemengde PWA-versies
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth-bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# MijnSerenity 7.3.2 — development assets
[[headers]]
  for = "/development-mode.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ha-live-bridge.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/live-cameras.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/live-cameras.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
