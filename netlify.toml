[build]
  publish = "."


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


# MijnSerenity 6.7.1 — waterwegrouter zonder Functions-map
[[redirects]]
  from = "/api/waterway-route"
  to = "https://brouter.grade.de/brouter"
  status = 200
  force = true

[[redirects]]
  from = "/api/waterway-route-backup"
  to = "https://brouter.de/brouter"
  status = 200
  force = true


# MijnSerenity 6.7.2 — Overpass-proxy voor bruggen, sluizen en POI's
[[redirects]]
  from = "/api/overpass"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-backup"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true


# MijnSerenity 7.10.2 — EuRIS Notice to Skippers voor vaarwegberichten
[[redirects]]
  from = "/api/euris-nts"
  to = "https://www.eurisportal.eu/api/v3/nts"
  status = 200
  force = true

# MijnSerenity 7.14.7 — beveiligde VRM proxy voor RuuviTags
[[redirects]]
  from = "/api/vrm-ruuvi"
  to = "/.netlify/functions/vrm-ruuvi"
  status = 200
  force = true

# MijnSerenity 7.15.16 — RWS WaterWebservices via same-origin proxy
# Nodig voor iOS/Safari: directe cross-origin POST naar RWS gaf "Load failed".
[[redirects]]
  from = "/api/rws-water-catalogus"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/METADATASERVICES/OphalenCatalogus"
  status = 200
  force = true

[[redirects]]
  from = "/api/rws-water-latest"
  to = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# MijnSerenity 7.4.6 — voorkom gemengde PWA-versies
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

