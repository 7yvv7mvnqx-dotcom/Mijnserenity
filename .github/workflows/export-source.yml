name: Export source

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: mijnserenity-source
          path: .
          include-hidden-files: true
          retention-days: 1

      - name: Prepare Netlify MCP tools
        run: |
          mkdir -p .deploy-tools
          cd .deploy-tools
          npm init -y >/dev/null 2>&1
          npm install --omit=dev @netlify/mcp@1.15.1

      - name: Upload Netlify MCP tools
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-tools
          path: .deploy-tools
          include-hidden-files: true
          retention-days: 1
