name: Temporary source package
on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -qr /tmp/mijnserenity-current.zip . -x ".git/*" ".github/workflows/temp-package.yml"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mijnserenity-source
          path: /tmp/mijnserenity-current.zip
          if-no-files-found: error
          retention-days: 1
