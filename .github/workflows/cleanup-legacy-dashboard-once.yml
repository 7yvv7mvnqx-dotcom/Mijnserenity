name: Cleanup legacy dashboard source once

on:
  push:
    paths:
      - 'cleanup-legacy-dashboard.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy dashboard from source index
        run: node scripts/clean-legacy-dashboard.mjs
      - name: Commit cleaned source
        run: |
          git config user.name "MijnSerenity cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html was already clean"
          else
            git commit -m "Remove legacy dashboard from source index"
            git push
          fi
