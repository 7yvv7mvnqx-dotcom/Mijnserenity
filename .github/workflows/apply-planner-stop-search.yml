name: Apply planner stop search patch

on:
  push:
    paths:
      - '.github/workflows/apply-planner-stop-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add planner search loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('route-control.js')
          text = path.read_text(encoding='utf-8')
          marker = '__msPlannerStopSearchLoader8236'
          if marker not in text:
              loader = """

          /* MijnSerenity 8.23.6 — tussenstop zoekmodule laden */
          (()=>{
            if(window.__msPlannerStopSearchLoader8236)return;
            window.__msPlannerStopSearchLoader8236=true;
            const script=document.createElement('script');
            script.src='/planner-stop-search-8236.js?v=823600';
            script.async=false;
            document.head.appendChild(script);
          })();
          """
              path.write_text(text.rstrip() + loader + '\n', encoding='utf-8')
              print('Loader appended.')
          else:
              print('Loader already present.')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- route-control.js; then
            echo "No route-control changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-control.js
          git commit -m "Load live search for planner between stops"
          git push origin HEAD:main
